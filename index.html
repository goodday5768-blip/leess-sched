<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>일정표 — 이승수영어</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1c1d21;--sub:#666870;--line:#dedcd5;--acc:#2f5bd3;--acc2:#e8eefc;--ok:#1f8a4c;--ng:#c8372d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.4}
.wrap{max-width:1400px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:22px;margin:0 6px 0 0}
.top .sp{flex:1}
#stamp{font-size:14px;color:var(--sub)}
#stamp.ng{color:var(--ng);font-weight:700}#stamp.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.err{color:var(--ng);font-size:14px;margin-top:6px}
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding:10px}
.side h3{font-size:13px;color:var(--sub);margin:10px 6px 4px;font-weight:700}
.side h3:first-child{margin-top:2px}
.stu{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:10px;font-size:17px}
.stu img,.stu .noimg{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eceae4;flex:none}
.stu small{display:block;font-size:12px;color:var(--sub);line-height:1.2}
.stu.on{background:var(--acc2);color:var(--acc);font-weight:700}
.stu .dot{margin-left:auto;font-size:11px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .who{font-size:21px;font-weight:700;margin-right:6px}
.bar .who small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
.bar .mlab{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.help{font-size:14px;color:var(--sub);margin:10px 2px 0}
.lg{display:inline-block;width:18px;height:12px;border-radius:2px 2px 9px 9px;vertical-align:-1px;margin:0 3px 0 10px}
.banner{background:#fff6d6;border:1px solid #e6cf7a;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.ed{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ed[hidden]{display:none}
.ed-box{background:var(--card);border-radius:16px;padding:18px;width:min(560px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.ed-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:19px}
.ed-h button{border:0;font-size:20px;padding:4px 10px}
#edTx{width:100%;font:inherit;font-size:19px;line-height:1.45;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafaf7;color:var(--ink);resize:vertical;min-height:130px}
.ed-m{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ed-m button{padding:7px 12px;font-size:15px}
.ed-m button.on{outline:2.5px solid var(--acc);outline-offset:1px;font-weight:700}
.ed-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-b .sp{flex:1}
@media(max-width:860px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:8px}.side h3{display:none}.stu{width:auto;flex:none}.stu small{display:none}}
/* 굿노트 월간 일정표(선생님 앱 「일정표」·오늘 할 일 앱 공용, 2026-11-09) */
.gc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc{background:#fff;color:#222;border:1px solid #d9d9d4;border-radius:12px;padding:16px 22px 24px;color-scheme:light;container-type:inline-size;min-width:700px;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
/* 캐릭터만 오른쪽 위에 고정(높이 0인 sticky 상자 — 자리를 차지하지 않는다) */
.gc-ch-fix{position:sticky;top:calc(var(--ink-h,0px) + var(--gc-top,0px) + 6px);height:0;z-index:5;display:flex;justify-content:flex-end;padding-right:10px;pointer-events:none}
.gc-ch-fix img{height:84px;max-width:120px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.gc-ch-fix{align-items:flex-start;gap:6px}
.gc-ch-row{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px;padding:8px 10px;background:#fff;border:1px solid #d9d9d4;border-radius:12px;color-scheme:light}
.gc-ch-row img{height:84px;max-width:120px;object-fit:contain;flex:none;margin-left:auto}
.gc-ch-row .gc-rng{max-width:none;flex:1;margin-top:0}
.gc-ch-row .gc-rb{max-width:none;box-shadow:none;background:#fafaf7}
.gc-rng{display:flex;gap:5px;align-items:stretch;margin-top:6px;max-width:min(78cqw,760px);pointer-events:auto}
.gc-rb{background:rgba(255,255,255,.94);border:1px solid #d9d9d4;border-radius:8px;padding:5px 8px;font-size:11px;font-size:clamp(10px,1.0cqw,12px);line-height:1.35;color:#333;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 2px 6px rgba(0,0,0,.12);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;flex:1 1 0;min-width:120px;max-width:300px}
.gc-rb b{display:block;color:#2f3a5c;margin-bottom:2px}
.gc-rb div{padding-left:7px;text-indent:-7px}
.gc-rb div::before{content:"· "}
.gc-wrap{container-type:inline-size}
.gc-wd{background:#edf2ff;border-radius:8px 8px 0 0;padding:7px 0 5px;margin-top:2px}
.gc-wm{text-align:center;letter-spacing:.35em;padding-left:.35em;font-weight:500;font-size:14px;font-size:clamp(13px,1.7cqw,19px);color:#2f3a5c;padding-bottom:4px}
.gc-wn{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:9.5px;font-size:clamp(8.5px,1.1cqw,11.5px);letter-spacing:.28em;color:#3b4252;font-weight:600;text-align:center}
.gc-wn span:first-child{color:#d0342c}.gc-wn span:last-child{color:#1e66f5}
.gc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid #bdbdbd;border-left:1.5px solid #bdbdbd}
.gc-c{position:relative;min-height:84px;min-height:clamp(78px,10.2cqw,116px);border-right:1.5px solid #bdbdbd;border-bottom:1.5px solid #bdbdbd;padding:27px 6px 7px 10px}
.gc-n{position:absolute;left:9px;top:6px;font-style:normal;font-size:11px;letter-spacing:.1em;color:#555;z-index:0}
.gc-n[class*=gc-m-]::before{content:"";position:absolute;left:-7px;top:0;width:25px;height:17px;border-radius:3px 3px 14px 14px;z-index:-1}
.gc-m-y::before{background:#fff35c}.gc-m-p::before{background:#ff8cc6}.gc-m-g::before{background:#b9ff5a}
.gc-k-g{background:#f1ffd9}
.gc-k-p{background:#ffe3f0}   /* 시험 날 칸(11-10 사용자: 「그 날의 칸은 색을 넣어」) */
.gc-out{background:#fafaf8}
.gc-t{font-size:14px;font-size:clamp(11.5px,1.6cqw,17px);line-height:1.35;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.gc-today{box-shadow:inset 0 0 0 2.5px #2f5bd3}
.gc-ok{color:#1a7f4b;font-weight:600}   /* 해석시험 통과(✔ 줄, 조교 앱이 기입) */
.gc-ai{color:#1e66f5}   /* Claude가 쓴 일정(§ 줄) */
.gc-sel{background:#e8eefc}
.gc-edit .gc-c,.gc-edit .gc-note{cursor:pointer}
.gc-edit .gc-c:hover{background:#f3f7ff}
.gc-wait{opacity:.55}
.gc-month{scroll-margin-top:calc(var(--ink-h,0px) + var(--gc-top,0px) + 8px)}
.gc-year .gc-month + .gc-month{margin-top:12px;padding-top:2px;border-top:2px dashed #c9c9c3}

</style>

<script>/* 홈 화면 앱(pwa.py): 아이폰이 아니면 manifest를 건다 · 주소의 ?dv=기기ID 는 저장된 ID가 없을 때만 받는다 */
(function () {
  var K = "leess-sched:device", ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (!/Android/i.test(ua) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var inapp = /KAKAOTALK|\bLine\//i.test(ua);
    if (dv && /^[0-9a-f]{8}$/i.test(dv) && (app || (q.get('via') === 'out' && !inapp)) && !localStorage.getItem(K)) localStorage.setItem(K, JSON.stringify(dv));
    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>

<body>
<div class="wrap">
  <div class="top"><h1>일정표</h1><span id="stamp"></span><span class="sp"></span><button id="reload">새로고침</button></div>
  <div id="login" class="card" hidden>
    <b>선생님 코드</b>
    <p style="margin:4px 0 8px;font-size:15px;color:var(--sub)">선생님 앱과 같은 코드입니다. 이 기기에만 저장됩니다.</p>
    <div style="display:flex;gap:8px"><input id="code" type="password" autocomplete="off" style="font:inherit;flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px"><button class="pri" id="codeGo">확인</button></div>
    <div class="err" id="codeMsg"></div>
  </div>
  <div id="main" hidden>
    <div class="banner" id="old" hidden></div>
    <div class="lay">
      <nav class="card side" id="side"></nav>
      <div>
        <div class="bar"><span class="who" id="who"></span><span class="sp" style="flex:1"></span><span class="mlab" id="mlab"></span><button id="now">이번 달로</button></div>
        <div id="cal"></div>
        <p class="help">칸을 누르면 그날 일정을 고칩니다. 고친 내용은 바로 저장되어 학생의 「오늘 할 일」 앱 일정표에 보입니다(학생은 고칠 수 없습니다).<br>표시 <i class="lg" style="background:#fff35c"></i>수업 <i class="lg" style="background:#ff8cc6"></i>시험 <i class="lg" style="background:#b9ff5a"></i>시험기간</p>
      </div>
    </div>
  </div>
</div>
<div class="ed" id="ed" hidden><div class="ed-box">
  <div class="ed-h"><b id="edT"></b><button id="edX" aria-label="닫기">✕</button></div>
  <textarea id="edTx" rows="5" placeholder="일정을 적습니다. 줄을 바꿔 여러 개를 적을 수 있습니다."></textarea>
  <div class="ed-m" id="edM"><button data-m="">자동</button><button data-m="n">표시 없음</button><button data-m="y" style="background:#fff9b0">수업</button><button data-m="p" style="background:#ffd3ea">시험</button><button data-m="g" style="background:#dcffad">시험기간</button></div>
  <div class="ed-b"><button id="edCopy">복사</button><button id="edPaste">붙여넣기</button><span class="sp"></span><button id="edDel">비우기</button><button class="pri" id="edOk">저장</button></div>
</div></div>

const PRE = null;   // 로컬 미리보기(_pv, 게시하지 않음): 서버 없이 화면만
// 굿노트 월간 일정표 그리기(선생님 앱 「일정표」·오늘 할 일 앱 공용, 2026-11-09)
const GC_MON = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const GC_WD = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const gcEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// 칸 글: 「§」로 시작하는 줄 = Claude가 쓴 일정(선생님 글과 구분되게 파란 글씨, 11-10 사용자 지시)
// 「✔」로 시작하는 줄 = 조교 선생님이 기입한 해석시험 통과(초록 글씨, 11-10 — 조교 앱 → 서버 tpass가 자동으로 적는다)
const gcText = t => String(t).split('\n').map(l => l.startsWith('§') ? `<span class="gc-ai">${gcEsc(l.slice(1).trim())}</span>` : l.startsWith('✔') ? `<span class="gc-ok">${gcEsc(l)}</span>` : gcEsc(l)).join('\n');
const gcYmd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
// 표시 자동 판정(선생님이 정한 표시가 없을 때): 시험기간(연두) > 굿노트에 찍혀 있던 표시(base.m) > 「…시험」(분홍) > 일정이 적힌 날(노랑)
// > 굿노트 마지막 표시(base.l) 뒤의 날짜는 최근 수업 요일(base.w) — 굿노트 표시가 없는 학생은 캘린더 메모의 수업 요일(dows)
function gcAuto(day, t, base, dows) {
  const M = base && base.m;
  if (base && base.x && base.x.indexOf(day) >= 0) return 'g';
  if (M && M[day]) return M[day];
  if (t && /시험\s*$/.test(t) && t.length <= 12) return 'p';
  if (t) return 'y';
  const p = day.split('-'), wd = new Date(+p[0], p[1] - 1, +p[2]).getDay();
  if (M && base.l) return day > base.l && (base.w || []).indexOf(wd) >= 0 ? 'y' : '';
  return dows && dows.indexOf(wd) >= 0 ? 'y' : '';
}
// base = {d:{날짜:글}, n:{달:메모}, x:[시험기간 날짜], m:{날짜:굿노트 표시}, l:마지막 표시 날짜, w:[최근 수업 요일]} · ov = {날짜 또는 달: [글, 표시]} (선생님이 고친 칸) · dows = 수업 요일
function gcCell(day, base, ov, dows) {
  const o = ov && ov[day], t = o ? o[0] : (base && base.d && base.d[day]) || '';
  const m = o && o[1] ? (o[1] === 'n' ? '' : o[1]) : gcAuto(day, t, base, dows);
  return {t, m};

/* 범용 필기 연결(inkpage.js, 2026-11-10) — ink.js 엔진을 시험앱 전용 필기(inknote.js)를 끼울 수 없는 모든 화면에 붙인다:
   교재·지문분석(article), EBS·수업관리 시험(#qs), 워크북(#stepBox·#exs), 교사용 교재(.page 쪽 그림), 최종정리(#root).
   화면 코드는 고치지 않고 body 변화를 보고 스스로 붙는다. 저장은 기기 IndexedDB(획만). 글 카드는 내용 해시로, 쪽 그림은 쪽 번호로, 교재 지문은 id로 찾는다.
   휴대폰(640 이하)과 넓은 화면은 글 배치가 달라 따로 저장. */
(() => {
  if (window.BOOKNOTE || document.getElementById('noteJs') || typeof INK === 'undefined') return;   // 시험앱 전용 필기가 있으면 그쪽이 맡는다
  const DBN = 'exnote', ST = 'rounds', OLD = 200 * 864e5, $ = s => document.querySelector(s);
  let salt0 = ''; try { if (typeof D !== 'undefined' && D && D.salt) salt0 = String(D.salt); } catch (e) {}
  const BOOK = new URLSearchParams(location.search).get('b') || '';
  const SALT = 'book:' + (salt0 || location.pathname.replace(/[^/]*$/, '')), PAGE = (location.pathname.split('/').pop() || 'guide').replace(/\.html$/, ''), NARROW = matchMedia('(max-width:640px)');

  /* ── 저장소 ── */
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST, {keyPath: 'id'}).createIndex('salt', 'salt');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  async function tx(mode, f) { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(ST, mode), rq = f(t.objectStore(ST)); let out; if (rq) rq.onsuccess = () => { out = rq.result; }; t.oncomplete = () => ok(out); t.onerror = t.onabort = () => no(t.error); }); }
  const recs = new Map(), dirty = new Set();
  async function load() {
    try {
      const all = await tx('readonly', s => s.index('salt').getAll(SALT)), now = Date.now(), old = [];
      all.forEach(r => { if (r.at && now - r.at > OLD) old.push(r.id); else recs.set(r.id, r); });
      if (old.length) tx('readwrite', s => { old.forEach(id => s.delete(id)); }).catch(() => {});   // 200일 넘게 손대지 않은 필기는 치운다
    } catch (e) {}
  }
  let cards = new Map(), cand = new Map(), timer = 0, stimer = 0;
  async function flush() {
    clearTimeout(timer); timer = 0; const list = [...dirty]; dirty.clear();
    try { for (const q of list) { await tx('readwrite', s => q.s.length ? s.put(q) : s.delete(q.id)); } if (list.length) INK.status('저장됨'); }
    catch (e) { INK.status('저장 실패'); }
  }
  function save(q) { dirty.add(q); q.at = Date.now(); if (q.s.length) recs.set(q.id, q); else recs.delete(q.id); INK.status('저장 중…'); clearTimeout(timer); timer = setTimeout(flush, 1000); }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  /* ── 어디에 붙나 ── */
  const SKIP = '.top,.bot,.panel,nav,header,footer,script,style,svg,[hidden],.ink-x,.ink-pad', INKSEL = '.ink-l,.ink-x,.ink-pad,#inkBar,#inkTop,#inkLive';
  function candidates() {
    const out = new Map(), add = (els, kind) => { for (const el of els) if (el.nodeType === 1 && !out.has(el)) out.set(el, kind); };
    const qs = $('#qs'); if (qs) add(qs.children, 'text');
    const exs = $('#exs'); if (exs) add(exs.children, 'text');
    const sb = $('#stepBox'); if (sb && [...sb.children].some(x => !x.matches(INKSEL))) add([sb], 'text');
    const app = $('#app');
    if (app) {
      const arts = app.querySelectorAll('main > article');
      if (arts.length) add(arts, 'book');
      else { const pg = app.querySelectorAll('.page'); if (pg.length) add(pg, 'img'); else add(kids(app), 'text'); }
    }
    const root = $('#root'); if (root) add(kids(root), 'text');
    const view = $('#view') || $('#main'); if (view && !app && !root) add(kids(view), 'text');   // 11-10 통합앱·선생님 앱·학습 현황·일정표(목록·현황 화면)에도 필기
    add(document.querySelectorAll('.gc-month'), 'text');   // 11-10 일정표 달력: 달 블록 하나 = 카드 하나(학생·달로 저장)
    return out;
  }
  // 뿌리의 자식 가운데 필기 카드가 될 것 — 달력(.gc-month)을 품은 칸은 통째로 붙이지 않고 그 안의 .card만(달력은 달 블록으로 따로)
  const kids = root => { const out = []; for (const x of root.children) { if (x.nodeType !== 1 || x.matches(SKIP)) continue; if (x.querySelector('.gc-month')) { for (const c of x.querySelectorAll('.card')) if (!c.querySelector('.gc-month') && !c.closest('.gc-wrap')) out.push(c); } else out.push(x); } return out; };
  const vis = el => el.getClientRects().length > 0;
  function norm(el) {   // 카드의 내용 지문(指紋): 그림·음원 파일 이름 + 글자(빈칸에 쓴 답·글상자는 들어가지 않는다)
    let t = ''; el.querySelectorAll('[data-enc],img[src]').forEach(i => { const k = i.dataset.enc || i.getAttribute('src') || ''; if (k && !/^(blob|data):/.test(k)) t += k + '|'; });
    return t + (el.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function hash(s) { let a = 2166136261, b = 5381; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 33) + c) | 0; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
  const sigs = new WeakMap();
  function ident(el, kind) {   // {id, …} — 글 카드는 내용이 그대로면 다시 계산하지 않는다
    if (kind === 'book') return {id: `${SALT}:${PAGE}:${(location.hash.match(/^#g(\d+)/) || [])[1]}:${el.id}:${NARROW.matches ? 'm' : 'w'}`};
    if (kind === 'img') return {id: `${SALT}:${PAGE}:${BOOK}:p${el.dataset.p || new URLSearchParams(location.search).get('p') || 1}`};
    if (el.classList.contains('gc-month')) return {id: `${SALT}:${PAGE}:cal:${(el.closest('.gc-wrap') || {dataset: {}}).dataset.ink || ''}:${el.id}`};   // 일정표: 학생·달로 고정(내용이 바뀌어도 같은 카드)
    const sig = (el.textContent || '').length + '/' + el.querySelectorAll('[data-enc],img[src]').length, old = sigs.get(el);
    if (old && old.sig === sig) return old;
    // head = 첫머리(「3. 주제」처럼 번호+유형 두 글자, 번호가 없으면 24자), probes = 본문 가운데 두 토막. 채점으로 해설·정오 표시가 덧붙어도 토막은 남는다 → 같은 카드로 본다
    const n = norm(el), L = n.length, v = {sig, n, id: `${SALT}:${PAGE}:t:${hash(n)}:${NARROW.matches ? 'm' : 'w'}`, head: (n.match(/^\d+\s*[.)]\s*\S{0,2}/) || [n.slice(0, 24)])[0], probes: [n.substr(L / 3 | 0, 40), n.substr(2 * L / 3 | 0, 40)]};
    sigs.set(el, v); return v;
  }
  const same = (c, v) => c.probes.some(p => v.n.includes(p));
  const blank = (id, kind) => ({id, salt: SALT, page: PAGE, kind, w: 0, s: []});
  const tag = (c, v) => { c.sig = v.sig; c.head = v.head || ''; c.probes = v.probes || ['']; c.len = v.n ? v.n.length : 0; return c; };
  function mount(el, kind, q, v) { const c = tag(INK.mount(el, kind, q), v); cards.set(el, c); return c; }
  function unmount(c) { INK.unmount(c); cards.delete(c.el); }

  function sync() {
    stimer = 0; cand = candidates(); const gone = [];   // 같은 문항이 새로 그려지면(채점 뒤 다시 그리기) 필기를 넘겨준다
    for (const [el, c] of [...cards]) {
      if (cand.has(el) && el.isConnected && c.svg.parentNode === el) continue;
      if (c.kind === 'text' && c.q.s.length && c.len >= 40) gone.push(c);
      unmount(c);
    }
    let any = false;
    for (const [el, kind] of cand) {
      if (!any && vis(el)) any = true;
      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
