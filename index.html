<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>일정표 — 이승수영어</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1c1d21;--sub:#666870;--line:#dedcd5;--acc:#2f5bd3;--acc2:#e8eefc;--ok:#1f8a4c;--ng:#c8372d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.4}
.wrap{max-width:1400px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:22px;margin:0 6px 0 0}
.top .sp{flex:1}
#stamp{font-size:14px;color:var(--sub)}
#stamp.ng{color:var(--ng);font-weight:700}#stamp.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.err{color:var(--ng);font-size:14px;margin-top:6px}
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding:10px}
.side h3{font-size:13px;color:var(--sub);margin:10px 6px 4px;font-weight:700}
.side h3:first-child{margin-top:2px}
.stu{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:10px;font-size:17px}
.stu img,.stu .noimg{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eceae4;flex:none}
.stu small{display:block;font-size:12px;color:var(--sub);line-height:1.2}
.stu.on{background:var(--acc2);color:var(--acc);font-weight:700}
.stu .dot{margin-left:auto;font-size:11px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .who{font-size:21px;font-weight:700;margin-right:6px}
.bar .who small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
.bar .mlab{min-width:118px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.help{font-size:14px;color:var(--sub);margin:10px 2px 0}
.lg{display:inline-block;width:18px;height:12px;border-radius:2px 2px 9px 9px;vertical-align:-1px;margin:0 3px 0 10px}
.banner{background:#fff6d6;border:1px solid #e6cf7a;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.ed{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ed[hidden]{display:none}
.ed-box{background:var(--card);border-radius:16px;padding:18px;width:min(560px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.ed-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:19px}
.ed-h button{border:0;font-size:20px;padding:4px 10px}
#edTx{width:100%;font:inherit;font-size:19px;line-height:1.45;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafaf7;color:var(--ink);resize:vertical;min-height:130px}
.ed-m{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ed-m button{padding:7px 12px;font-size:15px}
.ed-m button.on{outline:2.5px solid var(--acc);outline-offset:1px;font-weight:700}
.ed-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-b .sp{flex:1}
@media(max-width:860px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:8px}.side h3{display:none}.stu{width:auto;flex:none}.stu small{display:none}}
/* 굿노트 월간 일정표(선생님 앱 「일정표」·오늘 할 일 앱 공용, 2026-11-09) */
.gc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc{background:#fff;color:#222;border:1px solid #d9d9d4;border-radius:12px;padding:16px 22px 24px;color-scheme:light;container-type:inline-size;min-width:700px;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.gc-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;min-height:92px}
.gc-note{justify-self:start;background:#b9ff5a;border-radius:4px;padding:4px 9px;font-size:13px;font-size:clamp(11px,1.45cqw,15px);line-height:1.4;white-space:pre-wrap;max-width:100%}
.gc-note.gc-empty{background:transparent;color:#aaa;border:1px dashed #c8c8c8}
.gc:not(.gc-edit) .gc-note.gc-empty{visibility:hidden}
.gc-title{font-weight:300;letter-spacing:.4em;padding-left:.4em;font-size:26px;font-size:clamp(19px,3.5cqw,40px);white-space:nowrap;text-align:center;color:#111}
.gc-ch{justify-self:end;height:92px;display:flex;align-items:flex-start}
.gc-ch img{height:118px;max-width:150px;object-fit:contain;position:relative;z-index:2}
.gc-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:9px;font-size:clamp(8px,1.05cqw,11px);letter-spacing:.3em;color:#666;text-align:center;padding:12px 0 10px}
.gc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid #bdbdbd;border-left:1.5px solid #bdbdbd}
.gc-c{position:relative;min-height:84px;min-height:clamp(78px,10.2cqw,116px);border-right:1.5px solid #bdbdbd;border-bottom:1.5px solid #bdbdbd;padding:27px 6px 7px 10px}
.gc-n{position:absolute;left:9px;top:6px;font-style:normal;font-size:11px;letter-spacing:.1em;color:#555;z-index:0}
.gc-n[class*=gc-m-]::before{content:"";position:absolute;left:-7px;top:0;width:25px;height:17px;border-radius:3px 3px 14px 14px;z-index:-1}
.gc-m-y::before{background:#fff35c}.gc-m-p::before{background:#ff8cc6}.gc-m-g::before{background:#b9ff5a}
.gc-k-g{background:#f1ffd9}
.gc-out .gc-n{color:#bbb}.gc-out .gc-t{color:#999}
.gc-t{font-size:14px;font-size:clamp(11.5px,1.6cqw,17px);line-height:1.35;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.gc-today{box-shadow:inset 0 0 0 2.5px #2f5bd3}
.gc-sel{background:#e8eefc}
.gc-edit .gc-c,.gc-edit .gc-note{cursor:pointer}
.gc-edit .gc-c:hover{background:#f3f7ff}
.gc-wait{opacity:.55}

</style>

<script>/* 홈 화면 앱(pwa.py): 아이폰이 아니면 manifest를 건다 · 주소의 ?dv=기기ID 는 저장된 ID가 없을 때만 받는다 */
(function () {
  var K = "leess-sched:device", ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (!/Android/i.test(ua) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var inapp = /KAKAOTALK|\bLine\//i.test(ua);
    if (dv && /^[0-9a-f]{8}$/i.test(dv) && (app || (q.get('via') === 'out' && !inapp)) && !localStorage.getItem(K)) localStorage.setItem(K, JSON.stringify(dv));
    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>

<body>
<div class="wrap">
  <div class="top"><h1>일정표</h1><span id="stamp"></span><span class="sp"></span><button id="reload">새로고침</button></div>
  <div id="login" class="card" hidden>
    <b>선생님 코드</b>
    <p style="margin:4px 0 8px;font-size:15px;color:var(--sub)">선생님 앱과 같은 코드입니다. 이 기기에만 저장됩니다.</p>
    <div style="display:flex;gap:8px"><input id="code" type="password" autocomplete="off" style="font:inherit;flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px"><button class="pri" id="codeGo">확인</button></div>
    <div class="err" id="codeMsg"></div>
  </div>
  <div id="main" hidden>
    <div class="banner" id="old" hidden></div>
    <div class="lay">
      <nav class="card side" id="side"></nav>
      <div>
        <div class="bar"><span class="who" id="who"></span><span class="sp" style="flex:1"></span><button id="prev">‹ 이전 달</button><span class="mlab" id="mlab"></span><button id="next">다음 달 ›</button><button id="now">오늘</button></div>
        <div id="cal"></div>
        <p class="help">칸을 누르면 그날 일정을 고칩니다. 왼쪽 위 연두색 칸은 그 달 시험범위 메모입니다. 고친 내용은 바로 저장되어 학생의 「오늘 할 일」 앱 일정표에 보입니다(학생은 고칠 수 없습니다).<br>표시 <i class="lg" style="background:#fff35c"></i>수업 <i class="lg" style="background:#ff8cc6"></i>시험 <i class="lg" style="background:#b9ff5a"></i>시험기간</p>
      </div>
    </div>
  </div>
</div>
<div class="ed" id="ed" hidden><div class="ed-box">
  <div class="ed-h"><b id="edT"></b><button id="edX" aria-label="닫기">✕</button></div>
  <textarea id="edTx" rows="5" placeholder="일정을 적습니다. 줄을 바꿔 여러 개를 적을 수 있습니다."></textarea>
  <div class="ed-m" id="edM"><button data-m="">자동</button><button data-m="n">표시 없음</button><button data-m="y" style="background:#fff9b0">수업</button><button data-m="p" style="background:#ffd3ea">시험</button><button data-m="g" style="background:#dcffad">시험기간</button></div>
  <div class="ed-b"><button id="edCopy">복사</button><button id="edPaste">붙여넣기</button><span class="sp"></span><button id="edDel">비우기</button><button class="pri" id="edOk">저장</button></div>
</div></div>

const GC_MON = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const GC_WD = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const gcEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const gcYmd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
// 표시 자동 판정(선생님이 정한 표시가 없을 때): 시험기간(연두) > 굿노트에 찍혀 있던 표시(base.m) > 「…시험」(분홍) > 일정이 적힌 날(노랑)
// > 굿노트 마지막 표시(base.l) 뒤의 날짜는 최근 수업 요일(base.w) — 굿노트 표시가 없는 학생은 캘린더 메모의 수업 요일(dows)
function gcAuto(day, t, base, dows) {
  const M = base && base.m;
  if (base && base.x && base.x.indexOf(day) >= 0) return 'g';
  if (M && M[day]) return M[day];
  if (t && /시험\s*$/.test(t) && t.length <= 12) return 'p';
  if (t) return 'y';
  const p = day.split('-'), wd = new Date(+p[0], p[1] - 1, +p[2]).getDay();
  if (M && base.l) return day > base.l && (base.w || []).indexOf(wd) >= 0 ? 'y' : '';
  return dows && dows.indexOf(wd) >= 0 ? 'y' : '';
}
// base = {d:{날짜:글}, n:{달:메모}, x:[시험기간 날짜], m:{날짜:굿노트 표시}, l:마지막 표시 날짜, w:[최근 수업 요일]} · ov = {날짜 또는 달: [글, 표시]} (선생님이 고친 칸) · dows = 수업 요일
function gcCell(day, base, ov, dows) {
  const o = ov && ov[day], t = o ? o[0] : (base && base.d && base.d[day]) || '';
  const m = o && o[1] ? (o[1] === 'n' ? '' : o[1]) : gcAuto(day, t, base, dows);
  return {t, m};
}
const gcNote = (ym, base, ov) => ov && ov[ym] ? ov[ym][0] : (base && base.n && base.n[ym]) || '';
// o = {ym:'2026-11', cell: 날짜 => {t, m}, note, ch, today, sel(고른 날짜), edit, wait:{날짜:1}}
function gcHTML(o) {
  const [y, m] = o.ym.split('-').map(Number), first = new Date(y, m - 1, 1);
  let h = `<div class="gc-scroll"><div class="gc${o.edit ? ' gc-edit' : ''}"><div class="gc-top"><div class="gc-note${o.note ? '' : ' gc-empty'}" data-note="${o.ym}">${o.note ? gcEsc(o.note) : '시험범위 메모'}</div><div class="gc-title">${GC_MON[m - 1]} ${y}</div><div class="gc-ch">${o.ch ? `<img src="${o.ch}" alt="">` : ''}</div></div>`;
  h += `<div class="gc-wd">${GC_WD.map(w => `<span>${w}</span>`).join('')}</div><div class="gc-grid">`;
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m - 1, 1 - first.getDay() + i), day = gcYmd(d), c = o.cell(day) || {};
    h += `<div class="gc-c${d.getMonth() !== m - 1 ? ' gc-out' : ''}${day === o.today ? ' gc-today' : ''}${o.sel && day === o.sel ? ' gc-sel' : ''}${c.m ? ' gc-k-' + c.m : ''}${o.wait && o.wait[day] ? ' gc-wait' : ''}" data-day="${day}"><i class="gc-n${c.m ? ' gc-m-' + c.m : ''}">${d.getDate()}</i><div class="gc-t">${gcEsc(c.t || '')}</div></div>`;
  }
  return h + '</div></div></div>';
}

const getCode = () => { const v = lsGet(TK); if (!v) return ''; let c; try { c = JSON.parse(v); } catch (e) { c = v; } c = String(typeof c === 'string' ? c : v).trim(); if (c && v !== JSON.stringify(c)) lsSet(TK, JSON.stringify(c)); return c; };
const setCode = c => lsSet(TK, c ? JSON.stringify(c) : '');

async function openBlob(hex, b64) {
  const key = await crypto.subtle.importKey('raw', Uint8Array.from(hex.match(/../g), x => parseInt(x, 16)), 'AES-GCM', false, ['decrypt']);
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, key, raw.slice(12));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}

  catch (e) { stamp('학생 자료를 열지 못했습니다(열쇠 불일치). 일정표를 다시 빌드해야 합니다.', 'ng'); return; }
  OV = {};
  for (const x of r.rows || []) put(x[0], x[1], x[2], x[3]);
  for (const x of Q) put(x[0], x[1], x[2], x[3]);   // 아직 서버에 못 올린 수정
  $('#login').hidden = true; $('#main').hidden = false;
  $('#old').hidden = !OLD;
  if (OLD) $('#old').innerHTML = '채점 서버가 아직 옛 판이라 <b>고친 내용이 서버에 저장되지 않습니다</b>(이 기기에만 임시 보관). 「시험앱 공용 서버 코드(일정표)_2026-11-09」로 새 버전을 배포하면 자동으로 올라갑니다.';
  if (!ST[who]) who = ST[lsGet(LK)] ? lsGet(LK) : ORDER[0];
  render();
  stamp(OLD ? '서버 배포 전 — 보기만 가능' : Q.length ? `저장 대기 ${Q.length}건` : `불러옴 ${new Date().toTimeString().slice(0, 5)}`, OLD ? 'ng' : '');
  flush();
}
function wait() { const w = {}; for (const x of Q) if (x[0] === who) w[x[1]] = 1; return w; }
function render() {
  const groups = {};
  for (const n of ORDER) (groups[ST[n].gr || '기타'] = groups[ST[n].gr || '기타'] || []).push(n);
  let h = '';
  for (const g of [...GRADES, '기타']) if (groups[g]) h += `<h3>${esc(g)}</h3>` + groups[g].map(n => `<button class="stu${n === who ? ' on' : ''}" data-n="${esc(n)}">${ST[n].ch ? `<img src="${ST[n].ch}" alt="">` : '<span class="noimg"></span>'}<span>${esc(n)}<small>${esc(ST[n].sch || '')}</small></span></button>`).join('');
  $('#side').innerHTML = h;
  const S = ST[who], ov = OV[who] || {}, dows = (S.days || []).map(d => d[0]);
  $('#who').innerHTML = `${esc(who)}<small>${esc([S.sch, S.gr].filter(Boolean).join(' · '))}${S.days && S.days.length ? ' · 수업 ' + S.days.map(d => '일월화수목금토'[d[0]] + ' ' + d[1]).join(', ') : ''}</small>`;
  $('#mlab').textContent = `${ym.slice(0, 4)}년 ${+ym.slice(5)}월`;
  $('#cal').innerHTML = gcHTML({ym, cell: d => gcCell(d, S.base, ov, dows), note: gcNote(ym, S.base, ov), ch: S.ch, today: gcYmd(new Date()), edit: true, wait: wait()});
}
function openEd(key) {
  const S = ST[who], ov = OV[who] || {}, isNote = key.length === 7;
  edKey = key;
  if (isNote) { $('#edT').textContent = `${who} · ${+key.slice(5)}월 시험범위 메모`; $('#edTx').value = gcNote(key, S.base, ov); edMark = ''; }
  else { const p = key.split('-'), d = new Date(+p[0], p[1] - 1, +p[2]); $('#edT').textContent = `${who} · ${+p[1]}월 ${+p[2]}일 ${'일월화수목금토'[d.getDay()]}요일`; $('#edTx').value = gcCell(key, S.base, ov, []).t; edMark = ov[key] ? ov[key][1] || '' : ''; }
  $('#edM').hidden = isNote; $('#edPaste').disabled = !clip;
  paintMark(); $('#ed').hidden = false; setTimeout(() => $('#edTx').focus(), 30);

const paintMark = () => document.querySelectorAll('#edM button').forEach(b => b.classList.toggle('on', b.dataset.m === edMark));
const closeEd = () => { $('#ed').hidden = true; edKey = ''; };
function commit(text) {
  const t = text.replace(/\s+$/, ''), row = [who, edKey, t, edKey.length === 7 ? '' : edMark];
  put(...row);
  Q = Q.filter(x => !(x[0] === row[0] && x[1] === row[1])); Q.push(row); saveQ();
  closeEd(); render(); flush();
}
let busy = false;
async function flush() {
  if (busy || !Q.length || OLD) { if (OLD && Q.length) stamp(`서버 배포 전 — 이 기기에 임시 보관 ${Q.length}건`, 'ng'); return; }
  busy = true; stamp(`저장 중… ${Q.length}건`);
  const send = Q.slice();
  try {
    const r = JSON.parse(await (await fetch(DD.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({event: 'sched', code: getCode(), rows: send})})).text());
    if (!r.ok) throw new Error(r.error || 'fail');
    Q = Q.filter(x => !send.includes(x)); saveQ();
    stamp(`저장됨 ${(r.at || '').slice(11) || new Date().toTimeString().slice(0, 5)}`, 'ok');
  } catch (e) { stamp(`저장 안 됨 ${Q.length}건 — 인터넷을 확인하고 새로고침을 누르십시오(내용은 이 기기에 남아 있습니다)`, 'ng'); }
  busy = false; render();
  if (Q.length && !OLD && $('#stamp').className !== 'ng') flush();
}
const shift = n => { const d = new Date(+ym.slice(0, 4), +ym.slice(5) - 1 + n, 1); ym = gcYmd(d).slice(0, 7); render(); };
document.addEventListener('click', e => {
  const s = e.target.closest('.stu'); if (s) { who = s.dataset.n; lsSet(LK, who); render(); return; }
  const m = e.target.closest('#edM button'); if (m) { edMark = m.dataset.m; paintMark(); return; }
  if (e.target.id === 'ed') { closeEd(); return; }
  const nt = e.target.closest('.gc-edit .gc-note'); if (nt) { openEd(nt.dataset.note); return; }
  const c = e.target.closest('.gc-edit .gc-c'); if (c) openEd(c.dataset.day);
});
$('#prev').onclick = () => shift(-1); $('#next').onclick = () => shift(1);
$('#now').onclick = () => { ym = gcYmd(new Date()).slice(0, 7); render(); };
$('#reload').onclick = () => load();
$('#edX').onclick = closeEd;
$('#edOk').onclick = () => commit($('#edTx').value);
$('#edDel').onclick = () => { edMark = edMark === 'g' || edMark === 'p' ? edMark : ''; commit(''); };
$('#edCopy').onclick = () => { clip = $('#edTx').value; $('#edPaste').disabled = !clip; };
$('#edPaste').onclick = () => { const t = $('#edTx'); t.value = t.value ? t.value.replace(/\s+$/, '') + '\n' + clip : clip; t.focus(); };
document.addEventListener('keydown', e => { if ($('#ed').hidden) return; if (e.key === 'Escape') closeEd(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) commit($('#edTx').value); });
$('#codeGo').onclick = () => { const v = $('#code').value.trim(); if (!v) return; setCode(v); $('#codeMsg').textContent = ''; load(); };
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#codeGo').click(); });
window.addEventListener('online', flush);
load();
</script>

<div id="pwaBar" hidden><span>📲 <b>홈 화면에 앱으로 추가</b>하면 다음부터 아이콘으로 바로 열립니다.</span><button type="button" id="pwaHow">방법 보기</button><button type="button" class="ghost" id="pwaX" aria-label="안내 닫기">✕</button></div>

<script>/* 홈 화면 앱 설치 안내(pwa.py) — 홈 화면 앱으로 열었으면 막대·링크가 보이지 않는다 */
(function () {

  var SHARE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="공유"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>';
  function env(u) {

    if (/NAVER\(inapp|Instagram|FBAN|FBAV|DaumApps|BAND\/|everytimeApp|; wv\)/i.test(u) || (ios && !/Safari\//.test(u))) return {k: 'inapp', ios: ios};
    if (ios) return {k: 'ios', ios: true};
    if (/Android/i.test(u)) return {k: /SamsungBrowser/i.test(u) ? 'samsung' : 'android', ios: false};
    return {k: 'pc', ios: false};
  }
  function dev() { try { var v = JSON.parse(localStorage.getItem(K) || '""'); return /^[0-9a-f]{8}$/i.test(v) ? v : ''; } catch (e) { return ''; } }
  function outUrl(extra) { var d = dev(), p = d ? ['dv=' + d, 'via=out'] : []; if (extra) p.push(extra); return base + (p.length ? '?' + p.join('&') : ''); }
  function body(v) {
    var menu = '화면 위나 아래의 <b>⋯</b> 또는 <b>⋮</b> 메뉴 → <b>다른 브라우저로 열기</b>' + (v.ios ? '(또는 <b>Safari로 열기</b>)' : '');

      '<li>목록을 위로 올려 <b>홈 화면에 추가</b>를 누르세요.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝입니다.</li></ol>' +
      '<p class="pwa-s">아이폰은 홈 화면 앱을 따로 저장합니다. 아이콘으로 처음 열 때 이름과 동의를 한 번 더 하고, 그 뒤로는 <b>아이콘으로만</b> 여세요.</p>';
    if (deferred) return '<p>아래 버튼을 누르고 <b>설치</b>를 누르면 끝입니다.</p><button type="button" class="pwa-go" id="pwaInstall">앱 설치</button>';
    if (v.k === 'samsung') return '<ol><li>화면 아래 <b>≡</b> 메뉴를 누르세요.</li><li><b>페이지 추가</b>(또는 <b>현재 페이지 추가</b>) → <b>홈 화면</b>을 누르세요.</li><li><b>추가</b>를 누르면 끝입니다.</li></ol>';
    if (v.k === 'android') return '<ol><li>오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li><li><b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.</li><li><b>설치</b>(또는 <b>추가</b>)를 누르면 끝입니다.</li></ol>';

  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
  addEventListener('appinstalled', function () { bar.hidden = link.hidden = true; hide(); });
})();
</script>
